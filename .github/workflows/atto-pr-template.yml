name: AttoLang PR admission template
on:
  pull_request:
    paths:
      - '.github/PULL_REQUEST_TEMPLATE/atto-lang-candidate.md'
      - 'scripts/test-atto-pr-template.mjs'
      - '.github/workflows/atto-pr-template.yml'
  push:
    branches: [main]
    paths:
      - '.github/PULL_REQUEST_TEMPLATE/atto-lang-candidate.md'
      - 'scripts/test-atto-pr-template.mjs'
      - '.github/workflows/atto-pr-template.yml'
permissions:
  contents: read
jobs:
  candidate-template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test scripts/test-atto-pr-template.mjs
